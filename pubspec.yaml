name: syanti_app
description: "Syanti - vehicle maintenance app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Figma Font
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf

        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700

        - asset: assets/fonts/HankenGrotesk-ExtraBold.ttf
          weight: 800

  # Images
  assets:
    - assets/images/
